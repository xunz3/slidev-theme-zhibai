<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 552" width="980" height="552">
  <!-- 朱白封面概念：宣纸白底、左轴编辑构图、一处朱色焦点、右下印章 -->
  <rect width="980" height="552" fill="#faf8f3"/>

  <!-- eyebrow：短朱线 + 小号 label -->
  <rect x="64" y="196" width="24" height="1.5" fill="#b83521"/>
  <text x="98" y="200" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" font-weight="500" letter-spacing="0.4" fill="#6f6a62">Research colloquium · 01</text>

  <!-- 标题：serif display，焦点词用朱（每页仅此一处） -->
  <text x="64" y="268" font-family="Libertinus Serif, Noto Serif SC, Songti SC, serif" font-size="62" font-weight="600" letter-spacing="-0.5" fill="#232019">The Shape of a</text>
  <text x="64" y="336" font-family="Libertinus Serif, Noto Serif SC, Songti SC, serif" font-size="62" font-weight="600" letter-spacing="-0.5" fill="#232019"><tspan fill="#9e2f1c">Clear</tspan> Argument</text>

  <!-- 副题 -->
  <text x="64" y="392" font-family="Libertinus Serif, Noto Serif SC, Songti SC, serif" font-size="21" font-style="italic" fill="#6f6a62">One question, a careful method, evidence worth returning to.</text>

  <!-- 底部 meta 带：tonal 面 + 顶部分发丝线，作者 | 日期 | 印章 -->
  <rect x="0" y="468" width="980" height="84" fill="#f2eee6"/>
  <rect x="0" y="468" width="980" height="1" fill="#ddd6c8"/>
  <text x="64" y="506" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" font-weight="600" fill="#232019">Mira Chen</text>
  <text x="64" y="526" font-family="Inter, Noto Sans SC, sans-serif" font-size="12.5" fill="#6f6a62">Systems Research Group</text>
  <text x="806" y="513" font-family="Inter, Noto Sans SC, sans-serif" font-size="13" fill="#6f6a62">September 2026</text>

  <!-- 印章：白文方章，微倾 -2°，如手盖 -->
  <g transform="rotate(-2 858 510)">
    <rect x="840" y="492" width="36" height="36" rx="2.5" fill="#b83521"/>
    <text x="858" y="517" text-anchor="middle" font-family="Noto Serif SC, Songti SC, serif" font-size="20" font-weight="700" fill="#faf8f3">朱</text>
  </g>
</svg>
