name: Quality gates

on:
  workflow_call:
    inputs:
      ref:
        description: Source ref to check; defaults to the calling workflow ref
        default: ''
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test:release
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run quality
      - run: pnpm run package:check
      - name: Retain validated npm tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: .artifacts/package/*.tgz
          if-no-files-found: error
          retention-days: 14
      - name: Retain quality evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-evidence
          path: .artifacts/quality/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
